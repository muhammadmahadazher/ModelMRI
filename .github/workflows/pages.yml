name: Demo

# Publishes three things to GitHub Pages as one artifact:
#   /         the zero-install demo (pre-baked real responses, no backend)
#   /docs/    the documentation site
#   /viewer/  the .mri reader — opens an analysis someone sent you, with
#             nothing installed. This is the link you paste next to the file.
# The demo keeps the root because that is the link people are handed.
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/pages.yml"
      # The build's own assertions, and the script that produces what they
      # read. Neither was listed, so the job that RUNS demo_check.py did not
      # re-run when demo_check.py changed: a fix to it sat on main with the
      # last red run still showing, and a change that BROKE it would have gone
      # unnoticed until some unrelated frontend edit happened along. A check
      # you can edit without re-running is not a check.
      - "tests/demo_check.py"
      - "scripts/bake_demo.py"
  workflow_dispatch:

# Only the deploy job may write Pages. The build job compiles a frontend
# from npm dependencies; it has no business holding a token that can publish.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Bounded so a hang or a slow network fails fast rather than
    # sitting until GitHub's six-hour ceiling: a docs build.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Set up before the first step that needs it, not before the docs build
      # further down: the demo parity check runs on Python too, and
      # `python` is not on PATH on the runner without this.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the demo
        run: |
          cd frontend
          npm ci
          npm run build:demo
      - name: Verify the bundle is self-contained
        run: |
          test -f demo-dist/index.html
          test -d demo-dist/demo || (echo "demo payloads missing" && exit 1)
          grep -q "demo/llm.json\|assets/" demo-dist/index.html || true
          echo "demo build OK: $(du -sh demo-dist | cut -f1)"

      # The demo is the only ModelMRI most visitors will ever touch, and its
      # entire gate used to be the `test -f` above — while the .mri viewer
      # beside it is checked cell-for-cell. That asymmetry is how the demo
      # came to advertise 12x12 attention over three baked slices, and to
      # answer 409 on the button the README leads with.
      - name: The demo answers everything the tool does
        run: python tests/demo_check.py

      - name: Build the .mri viewer
        run: |
          cd frontend
          npm run build:viewer
      - name: Verify the viewer needs no backend
        run: |
          test -f modelmri/static/viewer/index.html
          # It must not ship demo payloads, and must not reference an API host.
          test ! -d modelmri/static/viewer/demo
          echo "viewer build OK: $(du -sh modelmri/static/viewer | cut -f1)"

      - name: Build the docs
        run: |
          pip install --quiet mkdocs-material
          mkdocs build --strict
      - name: Combine into one site
        run: |
          mv site demo-dist/docs
          cp -r modelmri/static/viewer demo-dist/viewer
          test -f demo-dist/docs/index.html || (echo "docs missing" && exit 1)
          test -f demo-dist/viewer/index.html || (echo "viewer missing" && exit 1)
          test -f demo-dist/index.html || (echo "demo clobbered" && exit 1)
          echo "combined: $(du -sh demo-dist | cut -f1)"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: demo-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Bounded so a hang or a slow network fails fast rather than
    # sitting until GitHub's six-hour ceiling: an upload.
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
