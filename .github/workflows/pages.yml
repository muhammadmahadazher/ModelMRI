name: Demo

# Publishes the zero-install demo to GitHub Pages: a static build that reads
# pre-baked real responses from frontend/public/demo (see scripts/bake_demo.py).
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the demo
        run: |
          cd frontend
          npm ci
          VITE_DEMO=1 npm run build
      - name: Verify the bundle is self-contained
        run: |
          test -f demo-dist/index.html
          test -d demo-dist/demo || (echo "demo payloads missing" && exit 1)
          grep -q "demo/llm.json\|assets/" demo-dist/index.html || true
          echo "demo build OK: $(du -sh demo-dist | cut -f1)"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
