name: Demo

# Publishes two things to GitHub Pages as one artifact:
#   /       the zero-install demo (pre-baked real responses, no backend)
#   /docs/  the documentation site
# The demo keeps the root because that is the link people are handed.
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the demo
        run: |
          cd frontend
          npm ci
          VITE_DEMO=1 npm run build
      - name: Verify the bundle is self-contained
        run: |
          test -f demo-dist/index.html
          test -d demo-dist/demo || (echo "demo payloads missing" && exit 1)
          grep -q "demo/llm.json\|assets/" demo-dist/index.html || true
          echo "demo build OK: $(du -sh demo-dist | cut -f1)"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the docs
        run: |
          pip install --quiet mkdocs-material
          mkdocs build --strict
      - name: Combine into one site
        run: |
          mv site demo-dist/docs
          test -f demo-dist/docs/index.html || (echo "docs missing" && exit 1)
          test -f demo-dist/index.html || (echo "demo clobbered" && exit 1)
          echo "combined: $(du -sh demo-dist | cut -f1)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
