name: Security

# CodeQL (codeql.yml) reads the code for vulnerable patterns. This reads
# everything around it: the dependencies we pull in, the workflows that run
# with repository credentials, and the history for anything that should
# never have been committed.
#
# Every tool here runs as a GitHub Action with no external account, so a
# fork or a contributor gets the same checks without signing up for anything.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, because a dependency does not have to change for a CVE to be
    # published against it. Wednesday morning, off the release path.
    - cron: "17 6 * * 3"

# Read-only by default. A job that needs more should say so and say why.
permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Known vulnerabilities in what we depend on
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v9
      - name: Audit the Python dependency tree
        run: |
          # The RESOLVED tree, not the declared ranges — what a user actually
          # installs is what matters. `--no-deps` audits exactly those pins
          # rather than re-resolving them, which also avoids pip choking on
          # local build tags like torch==2.11.0+cu128 that PyPI never saw.
          #
          # `--no-emit-workspace` drops the `-e .` line for our own packages.
          # Auditing ourselves against PyPI is meaningless, and worse than
          # meaningless: under --strict, pip-audit fails when it cannot find a
          # package, so the moment __version__ was bumped to an unpublished
          # 0.8.1 this job went red with "Dependency not found on PyPI:
          # modelmri (0.8.1)". It passed at 0.8.0 only because 0.8.0 was
          # already released — meaning the check was quietly coupled to "the
          # dev version is already on PyPI" and would break during every
          # release, which is the one time it must not.
          uv export --format requirements-txt --no-hashes --no-emit-workspace \
            | sed -E 's/\+[A-Za-z0-9.]+//' > /tmp/audit.txt
          uvx pip-audit --requirement /tmp/audit.txt --no-deps --strict \
            $(cat .github/pip-audit-ignore.txt | grep -v '^#' | grep . \
              | sed 's/^/--ignore-vuln /')

      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Audit the frontend dependency tree
        working-directory: frontend
        run: |
          npm ci
          # The frontend ships as static files with no server, so a
          # dev-only advisory is not the same risk as a runtime one. Fail on
          # what reaches users; report the rest.
          npm audit --omit=dev --audit-level=moderate
          npm audit || echo "(dev-only advisories above — not shipped to users)"

  workflows:
    name: The workflows themselves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v9
      # A workflow is code that runs with repository credentials. zizmor
      # finds the ways one can be turned against the repo: expression
      # injection from PR titles, over-broad permissions, unpinned actions,
      # and checkout of untrusted refs in privileged contexts.
      - name: Lint the GitHub Actions workflows
        run: uvx zizmor --config .github/zizmor.yml --format=plain .github/workflows/

  secrets:
    name: Nothing that should never have been committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Whole history: a secret removed in a later commit is still a
          # secret that was published.
          fetch-depth: 0
      - name: Scan the history for credentials
        # Third-party action, so pinned to an immutable object rather than a
        # movable tag.
        #
        # The previous pin, dcedce43, was described here as a commit and was
        # not one: `git/refs/tags/v2` reports type "tag", so that SHA is an
        # annotated tag OBJECT. It was still immutable, so the security
        # posture held — but the comment asserted something the API
        # contradicts, and Dependabot reads it as stale and proposes a
        # no-op bump to the commit it dereferences to. This SHA is the real
        # thing: `git/refs/tags/v3` reports type "commit".
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
