name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only. Nothing here writes to the repository, and a workflow that runs
# on pull_request runs code from forks — the token it holds should be able to
# do as little as possible.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Exact version, not `@v9`, because astral-sh/setup-uv does not publish
      # floating major tags — `@v9` resolves to nothing and every job using it
      # fails in three seconds with "unable to find version `v9`". Every other
      # action here does publish them, which is why this one line looks
      # inconsistent and is not.
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Lint, format, test
        run: |
          uv sync --dev
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest tests packages/modelmri-record/tests -q
      - name: The API reference still describes the API
        run: uv run python scripts/gen_api_docs.py --check

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Lint & build (skips until frontend exists)
        run: |
          if [ -f frontend/package.json ]; then
            cd frontend
            npm ci
            npm run lint --if-present
            npm run build --if-present
          else
            echo "Frontend not scaffolded yet — skipping."
          fi

  # Things only a browser can see. The bug this job exists for lived entirely
  # in a mount effect: every backend test passed while the page opened a
  # dataset and decoded video before anyone clicked anything.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Build the UI and the viewer
        run: |
          cd frontend
          npm ci
          npm run build
          npm run build:viewer
      - name: Install the browser
        run: |
          uv sync --dev
          uv run playwright install --with-deps chromium

      # The `.mri` format has two implementations — modelmri/session.py and
      # frontend/src/viewer.ts. Two implementations of one format drift, and
      # a viewer that renders a *slightly* different matrix than the tool is
      # worse than no viewer, because nothing on screen would say so. This
      # parses one file both ways and compares every cell.
      - name: The viewer agrees with the tool, cell for cell
        run: uv run python tests/viewer_check.py

      - name: Serve and check
        run: |
          uv run uvicorn --factory modelmri.server:create_app \
            --host 127.0.0.1 --port 5900 &
          server=$!
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:5900/api/session > /dev/null && break
            sleep 2
          done
          status=0
          uv run python tests/ui_check.py http://127.0.0.1:5900/ || status=$?
          # Stop the server before the job ends. A background process left
          # holding the environment open is its own bug, and under setup-uv v5
          # it also broke the job: the cache prune failed in post-cleanup with
          # exit 2, so every check passed and the job still reported red.
          #
          # v9 defaults `prune-cache` to false, so that particular failure
          # cannot happen now. The kill stays because it was always the right
          # thing to do — not because of the symptom it used to prevent.
          kill "$server" 2>/dev/null || true
          wait "$server" 2>/dev/null || true
          exit "$status"
