name: CI

on:
  push:
    branches: [main]
  # No `paths:` filter here, and its absence is load-bearing.
  #
  # There used to be one, listing everything that can affect behaviour so a
  # documentation-only change did not spend twelve minutes proving a four-way
  # OS matrix and a Playwright browser still work. That was a real saving and
  # it is genuinely gone.
  #
  # It cannot stay, because `main` is now a protected branch and these jobs are
  # its required checks. GitHub does not run a workflow whose paths filter
  # excludes every changed file, and a required check that never runs does not
  # pass — it sits at "Expected", forever, with no way to merge and nothing on
  # the page explaining why. So the filter's cost is not twelve minutes of
  # runner time; it is a pull request that can never land.
  #
  # That is not hypothetical for this repository. Its own rules require a
  # CHANGELOG entry and a GAPS.md annotation per unit of work, and neither path
  # was in the list, so a PR carrying only those two files -- an ordinary
  # bookkeeping commit -- would have hung on the first attempt.
  #
  # The alternatives were considered and cost more than they save: a companion
  # "skip" workflow duplicating every job name (including the four expanded
  # matrix names) drifts the day someone edits one of them, and a `changes` job
  # driving `if:` conditions either re-implements path matching in bash with the
  # list written twice, or pulls in a third-party action -- in a repository
  # whose Security workflow exists to audit exactly that.
  pull_request:

# Cancel superseded runs. Without this every push to a branch started a full
# matrix and the old one kept going -- on a branch with ten commits that is
# nine complete duplicate runs, all of them emailing on failure. The `main`
# group is keyed differently so a queued release build is never cancelled by
# the next merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only. Nothing here writes to the repository, and a workflow that runs
# on pull_request runs code from forks — the token it holds should be able to
# do as little as possible.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    # Bounded for the reason `crossplatform` gives: the full suite plus lint, format and the generated-docs check.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Exact version, not `@v9`, because astral-sh/setup-uv does not publish
      # floating major tags — `@v9` resolves to nothing and every job using it
      # fails in three seconds with "unable to find version `v9`". Every other
      # action here does publish them, which is why this one line looks
      # inconsistent and is not.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          # Keyed on uv.lock, so it is a miss exactly when dependencies move.
          # torch alone is several hundred megabytes to resolve and fetch.
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Lint, format, test
        run: |
          uv sync --dev
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest tests packages/modelmri-record/tests -q
      - name: The API reference still describes the API
        run: uv run python scripts/gen_api_docs.py --check

  # The README says Windows, macOS and Linux; pyproject says "OS Independent"
  # and claims Python 3.10 through 3.13. Until this job existed, every one of
  # those was tested on ubuntu-latest and one developer's Windows laptop.
  #
  # It is not a hypothetical worry. The code most likely to break off-Linux is
  # the code this project keeps touching: cache scanning that walks symlinks,
  # an uninstall that rmtree's model directories, and per-platform config
  # paths. Those fail on Windows in ways Linux cannot show you — locked files,
  # a different config root, case-insensitive path comparison.
  #
  # The matrix spans rather than exhausts: each OS appears, each supported
  # Python version appears, at four jobs instead of twelve. Lint and format
  # stay in `backend` above — they are platform-independent and running them
  # four more times would buy nothing.
  crossplatform:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    # A HANG SHOULD FAIL, NOT WAIT.
    #
    # With no `timeout-minutes` a job inherits GitHub's own ceiling of six
    # hours. Measured on this branch: two macOS jobs sat at 150 and 360
    # minutes against a 5-8 minute baseline, produced no log — an in-progress
    # job's log is not retrievable — and were cancelled having proved nothing.
    # The PR meanwhile read UNSTABLE rather than failed, so the wait looked
    # like slowness instead of a defect.
    #
    # 30 is roughly four times the slowest healthy run on the slowest runner,
    # so it fires on a hang and not on a bad day. `faulthandler_timeout` in
    # pyproject.toml dumps thread stacks at 300s, so the log now carries WHERE
    # it stopped before this kills it.
    timeout-minutes: 30
    strategy:
      # One platform failing should not cancel the others: which OSes broke is
      # the entire output of this job.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: "3.10"
          - os: windows-latest
            python: "3.13"
          - os: macos-latest
            python: "3.11"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          # Keyed on uv.lock, so it is a miss exactly when dependencies move.
          # torch alone is several hundred megabytes to resolve and fetch.
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      # bash on all three runners, so this is one script rather than three.
      # GitHub ships Git Bash on the Windows images; without this the block
      # would run under pwsh there and the syntax would differ.
      - name: Test
        shell: bash
        run: |
          uv sync --dev --python ${{ matrix.python }}
          uv run pytest tests packages/modelmri-record/tests -q

  frontend:
    runs-on: ubuntu-latest
    # Bounded for the reason `crossplatform` gives: install, typecheck and two bundles.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # `npm ci` re-downloaded the whole tree on every run in two separate
          # jobs. The lockfile is the cache key, so this is only a miss when
          # the dependencies actually changed.
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Typecheck only. This job used to build as well, and so does `ui` below
      # -- the same Vite build ran twice per PR for no extra coverage, because
      # a build that fails here fails there identically. The fast signal stays
      # on its own and the build lives where its output is actually used.
      #
      # It used to run `npm run lint --if-present`, and there has never been a
      # `lint` script in frontend/package.json, nor an ESLint, Biome or
      # Prettier config anywhere in the tree. `--if-present` is precisely the
      # flag that turns that into silence: the job installed forty-two packages
      # and then verified nothing, while reporting green and calling itself
      # "Lint". A check that cannot fail is worse than no check, because the
      # branch-protection page counts it.
      #
      # `tsc --noEmit` is the check this job was reaching for: it is the one
      # the three build scripts already run, it takes about the twenty seconds
      # the old comment claimed, and it fails on a real defect. Adding a
      # linter is a larger question -- a dependency, a config, and whatever
      # it says about twenty-nine thousand lines of existing TSX -- and it is
      # not this pull request's to answer.
      - name: Typecheck
        run: |
          cd frontend
          npm ci
          npm run typecheck

  # Things only a browser can see. The bug this job exists for lived entirely
  # in a mount effect: every backend test passed while the page opened a
  # dataset and decoded video before anyone clicked anything.
  ui:
    runs-on: ubuntu-latest
    # Bounded for the reason `crossplatform` gives: a real browser, so slower than the others and still bounded.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # `npm ci` re-downloaded the whole tree on every run in two separate
          # jobs. The lockfile is the cache key, so this is only a miss when
          # the dependencies actually changed.
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          # Keyed on uv.lock, so it is a miss exactly when dependencies move.
          # torch alone is several hundred megabytes to resolve and fetch.
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Build the UI, the viewer and the demo
        run: |
          cd frontend
          npm ci
          npm run build
          npm run build:viewer
          npm run build:demo
      # `--with-deps` used to be on this line. It shells out to apt-get for
      # Chromium's shared libraries, and on 2026-08-19 that call stopped
      # returning: two runs on two different runners sat in this step until
      # the six-hour job timeout killed them, against a 22-second baseline.
      # Every step around it ran at normal speed, so it was this apt call and
      # nothing else. The job never reached the checks it exists to run.
      #
      # The flag was buying nothing here: the ubuntu-latest image already
      # ships those libraries, which is why `tests/ui_check.py` and
      # `tests/viewer_check.py` have always told contributors to run plain
      # `playwright install chromium` and why that works. CI was the one
      # place paying an apt round-trip for a dependency it already had.
      #
      # If a future runner image drops them, this step fails fast with a
      # named missing .so rather than hanging -- a better failure than the
      # one this replaces. Put the flag back then, and pin the image.
      - name: Install the browser
        run: |
          uv sync --dev
          uv run playwright install chromium

      # The `.mri` format has two implementations — modelmri/session.py and
      # frontend/src/viewer.ts. Two implementations of one format drift, and
      # a viewer that renders a *slightly* different matrix than the tool is
      # worse than no viewer, because nothing on screen would say so. This
      # parses one file both ways and compares every cell.
      - name: The viewer agrees with the tool, cell for cell
        run: uv run python tests/viewer_check.py

      # The third UI gate, and until this line the only one that ran AFTER the
      # merge rather than before it.
      #
      # `demo_check.py` lived solely in pages.yml, which triggers on
      # `push: main`. So a pull request that broke the demo went green, merged,
      # and turned the Pages deploy red on `main` -- where the fix is another
      # pull request and the demo is already broken for whoever visits it. The
      # demo is the only ModelMRI most people ever touch; its gate belongs on
      # the side of the merge where breaking it is still cheap.
      #
      # It costs almost nothing to move here. The script imports base64, json,
      # os, re, sys and pathlib and reads the built bundle -- no torch, no
      # model, no server -- so all it needed was `npm run build:demo`, added to
      # the build step above. It runs beside viewer_check because they are the
      # same kind of gate and both want the environment `uv sync --dev` has
      # already prepared.
      #
      # pages.yml keeps its own copy. That one guards the artifact actually
      # being published, which is a different question from whether this change
      # broke it.
      - name: The demo answers everything the tool does
        run: uv run python tests/demo_check.py

      - name: Serve and check
        run: |
          uv run uvicorn --factory modelmri.server:create_app \
            --host 127.0.0.1 --port 5900 &
          server=$!
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:5900/api/session > /dev/null && break
            sleep 2
          done
          status=0
          # No model is loaded here on purpose (/api/model/load is in
          # ui_check's own EXPENSIVE list — the point of the first section is
          # that nothing loads until asked), so the sections that need one are
          # skipped. They are printed as NOT CHECKED at the end of the run
          # rather than passing silently: measured, that is 14 checks,
          # including all five over the head-ranking panel. Read the summary,
          # not just the exit code.
          uv run python tests/ui_check.py http://127.0.0.1:5900/ || status=$?
          # Stop the server before the job ends. A background process left
          # holding the environment open is its own bug, and under setup-uv v5
          # it also broke the job: the cache prune failed in post-cleanup with
          # exit 2, so every check passed and the job still reported red.
          #
          # v9 defaults `prune-cache` to false, so that particular failure
          # cannot happen now. The kill stays because it was always the right
          # thing to do — not because of the symptom it used to prevent.
          kill "$server" 2>/dev/null || true
          wait "$server" 2>/dev/null || true
          exit "$status"
