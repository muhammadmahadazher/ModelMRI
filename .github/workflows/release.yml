name: Release

# Tag vX.Y.Z -> build the frontend into the wheel, verify it, attach both
# artifacts to the GitHub release. (PyPI publish stays a manual `uv publish`
# with the owner's token.)
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v5

      - name: Build frontend into the package
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build wheel + sdist
        run: uv build

      - name: Verify the frontend is inside the wheel
        run: |
          python - <<'EOF'
          import glob, zipfile
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          assert any("static/app/index.html" in n for n in names), "frontend missing from wheel"
          assert any("static/app/assets/" in n and n.endswith(".js") for n in names), "js missing"
          print("wheel OK:", whl)
          EOF

      - name: Attach artifacts to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes dist/* \
            || gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
