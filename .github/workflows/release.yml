name: Release

# Tag vX.Y.Z -> build the frontend into the wheel, verify it, attach both
# artifacts to the GitHub release. (PyPI publish stays a manual `uv publish`
# with the owner's token.)
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v7

      - name: Build frontend into the package
        run: |
          cd frontend
          npm ci
          npm run build
          # The .mri viewer ships inside the wheel too: `modelmri open` serves
          # it from the standard library, and without it that command can only
          # apologise. Neither bundle is committed, so if this line goes the
          # wheel goes out broken and nothing else notices.
          npm run build:viewer

      - name: Build wheel + sdist
        run: uv build

      - name: Verify both bundles are inside the wheel
        run: |
          python - <<'EOF'
          import glob, zipfile
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          def has(prefix, ext):
              return any(prefix in n and n.endswith(ext) for n in names)
          assert has("static/app/", "index.html"), "app missing from wheel"
          assert has("static/app/assets/", ".js"), "app js missing"
          assert has("static/viewer/", "index.html"), "viewer missing from wheel"
          assert has("static/viewer/assets/", ".js"), "viewer js missing"
          print("wheel OK:", whl)
          EOF

      - name: Attach artifacts to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes dist/* \
            || gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
