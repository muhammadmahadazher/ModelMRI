name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly-published advisory is caught without a push.
    - cron: "23 5 * * 1"

# Cancel superseded runs. Without this every push to a branch started a full
# matrix and the old one kept going -- on a branch with ten commits that is
# nine complete duplicate runs, all of them emailing on failure. The `main`
# group is keyed differently so a queued release build is never cancelled by
# the next merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    # Bounded so a hang or a slow network fails fast rather than
    # sitting until GitHub's six-hour ceiling: two languages, and CodeQL builds a database.
    timeout-minutes: 25
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
