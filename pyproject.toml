[project]
name = "modelmri"
# Single source: modelmri/__init__.py. Four hand-maintained copies of a
# version number is four chances to ship a wrong one, and the UI footer
# already shipped "MRI-0.3" through the whole 0.4 line.
dynamic = ["version"]
description = "Chrome DevTools for AI models and agents — see attention, features, and agent steps inside any local model."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Muhammad Mahad Azher", email = "mahadazher@gmail.com" }]
keywords = [
  "interpretability",
  "mechanistic-interpretability",
  "llm",
  "agents",
  "agent-observability",
  "debugging",
  "devtools",
  "sparse-autoencoder",
  "attention-visualization",
  "activation-steering",
  "logit-lens",
  "transformers",
  "pytorch",
  "local-first",
]
# PyPI lets people filter by classifier, so a short list is a smaller surface
# to be found on. Every entry below is checkable: the Python versions are the
# ones CI runs, and "OS Independent" is claimed because the CI matrix covers
# Windows, macOS and Linux — not because the package happens to be pure
# Python. A classifier is a claim like any other.
#
# No `License ::` classifier, on purpose: `license` above is an SPDX
# expression (PEP 639), and PyPI rejects an upload that carries a license
# classifier next to one. The expression is the claim.
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Visualization",
  "Topic :: Software Development :: Debuggers",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "transformers>=4.48",
  "torch>=2.5",
  "accelerate>=1.2",
  "safetensors>=0.4",
  "huggingface_hub>=0.26",
  # One recorder, not two. modelmri.record re-exports this; the in-tree copy
  # had drifted and was missing credential redaction, on the import path the
  # README documents. Stdlib-only and 10.9 KiB.
  # 0.1.3 adds trace(meta=...), which the shipped demo trace uses to mark
  # itself as sample data rather than a run you recorded.
  "modelmri-record>=0.1.3",
]

[project.urls]
# PyPI renders these as the sidebar links, and they are the only navigation a
# visitor who arrives from `pip search`-shaped traffic ever gets. Two entries
# meant the docs, the demo and the issue tracker were unreachable from the
# package page.
Homepage = "https://muhammadmahadazher.github.io/ModelMRI/"
Documentation = "https://muhammadmahadazher.github.io/ModelMRI/docs/"
Repository = "https://github.com/muhammadmahadazher/ModelMRI"
Changelog = "https://github.com/muhammadmahadazher/ModelMRI/blob/main/CHANGELOG.md"
Issues = "https://github.com/muhammadmahadazher/ModelMRI/issues"
Demo = "https://muhammadmahadazher.github.io/ModelMRI/"

[project.scripts]
modelmri = "modelmri.cli:main"

[project.optional-dependencies]
# Constrained decoding. Optional because it is the ONLY honest way to get a
# correct token-level mask: a wrong mask is an invisible failure in a tool
# whose premise is not shipping invisible wrong answers, so ModelMRI will not
# hand-write one. Pure Python, works offline.
grammar = ["lm-format-enforcer>=0.10"]

vla-lite = [
    "av>=13,<18",
    # ALOHA and robomimic files. In the LITE extra rather than the full one:
    # reading an HDF5 dataset needs no policy, no GPU and no lerobot, which is
    # the whole distinction this extra draws.
    "h5py>=3.8",
    "pillow>=10",
    "pyarrow>=15",
]
# Running an image model, as opposed to READING one. `modelmri/imaging.py`
# identifies a checkpoint from its JSON and its safetensors header with no
# dependency at all — that is what lets the picker list your diffusion models
# on a machine with none of this installed. Everything below is only needed to
# take a forward pass through one.
#
# diffusers is not pinned tightly: unlike lerobot it shares torch's release
# cadence rather than fighting it, so it can live in ModelMRI's own
# environment instead of needing the sidecar treatment.
image = [
    "diffusers>=0.31",
    "pillow>=10",
    "safetensors>=0.4",
    # Text encoders for every conditional pipeline are transformers models,
    # and transformers is already a base dependency — named here anyway so
    # `pip install modelmri[image]` states its whole requirement rather than
    # relying on another extra's leftovers.
    "transformers>=4.48",
    # What a NON-diffusion image model needs to preprocess a picture.
    # transformers backs its fast image processors with torchvision, and
    # without it `AutoImageProcessor.from_pretrained` raises ImportError for
    # every ViT, detector and segmenter this extra exists to open — measured
    # on `facebook/sam3`, whose processor is published and unreadable.
    #
    # A preprocessor is not a nicety here. A ViT is trained at one size with
    # one per-channel normalisation, and an image prepared any other way
    # produces logits that are a real number about the wrong tensor.
    "torchvision>=0.16",
]
# Only for measuring quantisation damage, which has to dequantise real weights.
# `modelmri.gguf_read` reads a GGUF's header with the stdlib and needs none of
# this — reading the table describing tensors and unpacking the tensors
# themselves are different jobs, and only the second one earns a dependency.
gguf = [
    "gguf>=0.10",
    "numpy>=1.24",
    "safetensors>=0.4",
]

[dependency-groups]
# playwright belongs here, not in an ad-hoc `uv run pip install`: uv run
# re-syncs the environment to the lockfile before every command, so a
# package installed outside it is gone by the next line. CI caught that.
dev = [
    # Floor, not a pin: the [tool.ruff] block below is verified against 0.15.20
    # (what uv.lock resolves) and 0.16.2, which agree on all 150 rules it
    # enables. `>=0.8` let a five-major-series-old ruff satisfy the gate while
    # reporting something else entirely. `select` protects against the default
    # rule set changing under an upgrade; it does not protect against a new
    # rule being *added* to a family that is selected, so an upgrade is still
    # a change worth reading the diff of.
    "ruff>=0.15.20",
    # `uv run reuse lint` locally is the same check CI runs; the extra is the
    # encoding detector reuse needs on a machine without libmagic or `file`.
    "reuse[charset-normalizer]>=6",
    "pytest>=8",
    # Parallel test execution. The suite is 883 tests over ~30 files and was
    # taking 345s serially, of which 68s is collection -- almost all of that
    # importing torch. Workers pay the import once each, in parallel, so the
    # win is real but sublinear. Measured in pyproject's pytest config below.
    "pytest-xdist>=3.6",
    "httpx>=0.27",
    "playwright>=1.48",
    # Pillow ships in the vla-lite extra, which `uv sync --dev` does not
    # install -- but torch is a BASE dependency, so the VLA tests get past
    # their `importorskip("torch")` and reach `encode_png` on every runner.
    # They passed anywhere something else happened to pull Pillow in and
    # failed on macos/3.11, where nothing did. Guarding the tests with a
    # skip would have turned that into a check that quietly stopped running.
    "pillow>=10",
    # The grammar extra, for the same reason. `tests/test_grammar.py` opens
    # with `importorskip("lmformatenforcer")`, so without it here the ENTIRE
    # file skipped -- every test for constrained decoding, on every runner and
    # on every developer machine, reported as a pass. The feature shipped with
    # its suite switched off and nothing said so.
    #
    # It stays an OPTIONAL extra for users, which is a separate decision and
    # the right one: a wrong mask is an invisible failure and this project
    # will not hand-write a grammar compiler to avoid a dependency. Optional
    # to install is not the same as optional to test.
    "lm-format-enforcer>=0.10",
    # And the two readers from vla-lite, found the same way: a sweep of every
    # `importorskip` target in the suite against what `uv sync --dev` actually
    # installs. `test_hdf5_data.py` and `test_vla_routing.py` were skipping
    # whole-file, so the ALOHA/robomimic reader and the camera routing had no
    # running tests anywhere. Three suites were dark in total.
    "h5py>=3.8",
    "pyarrow>=15",
    # tomllib landed in 3.11. The version-drift test parses pyproject.toml, and
    # without this it would simply not run on the 3.10 CI cell — the one cell
    # where an import error is most likely to be mistaken for "unsupported".
    "tomli>=2; python_version < '3.11'",
    # The image extra, for the same reason pillow and h5py are here: without
    # it `tests/test_image_attention.py` sits behind an `importorskip` and
    # goes dark on every runner, which is how three suites in this repo were
    # already silently not running.
    "diffusers>=0.31",
    # And the OTHER half of the image extra, which the diffusers line above
    # does not cover. transformers backs its fast image processors with
    # torchvision, so without this every non-diffusion image checkpoint —
    # ViT, detector, segmenter — loads with `processor: None` on every
    # runner. The tests would then all exercise the "no preprocessor" branch
    # and none of them the real one, which is a suite that passes without
    # testing the feature. Measured on `facebook/sam3`: the checkpoint
    # publishes a processor and it was unreadable for want of this package.
    "torchvision>=0.16",
    # The sidecar's BASE package — stdlib-only, no lerobot. Its input rules
    # decide whether a frame reaching a policy is the frame the policy was
    # trained on, which is a question worth testing on every runner rather
    # than behind an `importorskip` that would go dark exactly the way three
    # other suites already did.
    #
    # This does NOT weaken the venv separation. What cannot share an
    # environment with ModelMRI is lerobot, and lerobot lives in the `policy`
    # EXTRA, which nothing here installs. A test asserts that no module under
    # `modelmri/` ever imports this package, because the client declaring its
    # own contract version is the whole handshake.
    "modelmri-policy",
]

# ------------------------------------------------------------------ the suite
# There was no [tool.pytest.ini_options] at all, so every run took whatever
# pytest defaulted to -- which meant serial, and the suite had grown to 871
# tests over 47 files and four and a half minutes. Measured on a 24-core
# machine with 16.9 GB of RAM, same tree, same 870 passing:
#
#     serial          275.7s   peak python RSS 4.93 GB
#     -n 4            112.3s   peak python RSS 6.79 GB
#     -n 8             79.5s   peak python RSS 6.04 GB
#
# Sublinear because roughly 20s of every worker is importing torch, and each
# worker pays that separately. 3.5x is still 3.5x.
[tool.uv]
# Pinned so CI does not have to ask the network what version to install.
#
# `astral-sh/setup-uv` looks for a version in uv.toml and then in this file,
# and finding neither it "falls back to latest" -- which means fetching a
# manifest from raw.githubusercontent.com on every job. That is a network call
# in the setup step of every CI job, and on 2026-08-16 it failed:
#
#     Could not determine uv version from uv.toml or pyproject.toml.
#       Falling back to latest.
#     Fetching manifest data from .../astral-sh/versions/.../uv.ndjson ...
#     ##[error]fetch failed
#
# One job red on main, nothing to do with the code, and the same fetch sits in
# front of every other job. Declaring the version here is read locally, so the
# call does not happen at all -- and it also states which uv this project is
# actually developed against instead of leaving it to whatever shipped today.
required-version = ">=0.10,<0.11"

[tool.pytest.ini_options]
addopts = [
  # `auto` reads the machine, so a 2-core CI runner gets 2 workers and a
  # workstation gets more. The cap is about MEMORY, not cores: each worker is
  # a fresh interpreter with its own torch, and 24 of those would ask for
  # more RAM than the machine measured above has. 8 was the fastest count
  # tried and the cap is set there rather than higher on no evidence.
  "-n", "auto",
  "--maxprocesses=8",
  # Per FILE, not per test. Three test modules use `scope="module"` fixtures,
  # and the default `load` scheduler would split a module across workers and
  # rebuild those fixtures per worker -- correct but wasteful. It also keeps
  # anything file-local from interleaving. Verified there is nothing worse
  # hiding behind it: every test in the suite writes under `tmp_path`, and
  # the ones touching real config redirect MODELMRI_HOME and HF_HUB_CACHE to
  # `tmp_path` first, so workers cannot collide on a shared path.
  "--dist", "loadfile",
  # A DEAD WORKER MUST FAIL THE RUN, NOT STALL IT.
  #
  # xdist's default is to restart a worker that dies and carry on, and when
  # the death is a hard crash rather than a raised exception that turns into
  # a wait with no end. MEASURED on CI, `tests (windows-latest, py3.13)`:
  #
  #   14:02:42  Windows fatal exception: code 0xc000001d
  #   14:02:42  [gw0] node down: Not properly terminated
  #   14:04:19  ..... 99%
  #   14:21:53  OSError: cannot send (already closed?)  x2, in
  #             pytest_sessionfinish
  #   14:21:54  ##[error]The operation was canceled.
  #
  # Seventeen and a half minutes between the last test and the wall-clock
  # timeout, and the job was CANCELLED rather than failed — so the run
  # reported as slow instead of broken, and the summary that would have named
  # the crashing test never printed. `0xc000001d` is STATUS_ILLEGAL_INSTRUCTION:
  # a torch kernel using an instruction set that particular runner does not
  # have. It has now happened on two separate runs.
  #
  # `0` means "do not restart, end the session", so the crash is reported in
  # seconds WITH the failure summary. That is strictly more information than
  # the 30-minute cancellation, and it is the same rule the workflow's own
  # `timeout-minutes` comment states: a hang should fail, not wait.
  "--max-worker-restart=0",
]

# A HANG HAS TO SAY WHERE IT HUNG.
#
# Under xdist a stuck worker produces nothing at all: it stops, the controller
# waits, and the job sits until the runner's own ceiling kills it. Measured on
# this branch's CI — two macOS jobs ran 150 and 360 minutes against a 5-8
# minute baseline, and both were cancelled with zero output. Six hours of
# runner time bought no information about which test stopped.
#
# `faulthandler_timeout` makes the interpreter dump every thread's stack after
# this many seconds with no test completing, then carry on. So a deadlock
# prints the two frames holding the locks, in the log, on the machine where it
# actually reproduced — which is the only place some of these appear.
#
# 300s is comfortably above the slowest single test here (the image-model
# fixtures build real pipelines) and far below any sane job ceiling.
faulthandler_timeout = 300

# Pass `-n 0` to turn all of that off, which is what you want when a test is
# actually failing: serial output stays in order, `-x` stops where you expect,
# and `--pdb` gets a terminal.

# ------------------------------------------------------------------- the gate
# There was no [tool.ruff] here at all, which meant `uv run ruff check .` in CI
# enforced whichever rule set the pinned ruff happened to default to — and that
# default is not stable across releases. Measured on this tree, unchanged: ruff
# 0.15.20 (the version in uv.lock) defaults to E4/E7/E9/F and reports nothing;
# ruff 0.16.2 defaults to a far wider set and reports 159 findings. A
# `uv lock --upgrade` for some unrelated dependency would have turned main red
# with 159 errors belonging to nobody's change.
#
# So the gate is written down. Every rule below is one this tree satisfies;
# every family deliberately left out is listed at the bottom with the reason.
# `select` is a full replacement for the default, not an addition to it, so
# what is here is the whole gate on any ruff version.
[tool.ruff]
# Stated rather than inherited, for the same reason as everything else in this
# block: it is what the formatter wraps to, and E501 is switched off below on
# the strength of it.
line-length = 88

# Ruff 0.16 began formatting fenced code blocks inside Markdown; 0.15 does not
# look at .md at all. That is a real difference in what `ruff format --check .`
# covers, and it lands on hand-wrapped documentation samples — docs/guides
# narrow their columns for the rendered page, not for an 88-column formatter.
# Ruff formats the Python in this repo. Prose is not Python.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
  "F",      # pyflakes — real errors: undefined names, unused imports
  "E",      # pycodestyle errors (E402 included, see per-rule note below)
  "W",      # pycodestyle warnings
  "I",      # isort — import order is mechanical, so a tool should own it
  "UP",     # pyupgrade — requires-python is >=3.10, so use what 3.10 has
  "A",      # flake8-builtins — shadowing `input`/`id`/`type` reads as the builtin
  "B",      # flake8-bugbear (minus B023, see below)
  "N802",   # method names are lowercase
  "RUF100", # every `# noqa` must still be suppressing something
  # A different claim from BLE001, which is why it survives where BLE001 does
  # not. BLE001 asks whether a catch is too broad; S110 asks whether the
  # handler body does nothing AND records nothing, which is the actual shape
  # of an accidental swallow. It fires 4 times, all of them fallback chains
  # where the handling is the next statement, so the price is 4 directives —
  # and this repo has already had to do one pass over silent excepts, so a
  # guard against the next one is worth that.
  "S110",
]

ignore = [
  # The formatter owns line length. It wraps code to 88 and leaves prose and
  # long string literals alone, which is the right call for both — and this
  # repo's comments carry a lot of the reasoning, so a hard 88 on them would
  # be a rule about paragraph shape. 19 lines currently sit at 89-169 columns
  # and every one of them is a comment, a URL or an unbreakable literal.
  "E501",
  # Late-binding closures in a loop. Every one of the 11 sites flagged here
  # runs its closure to completion inside the iteration that created it —
  # `shutil.rmtree` returns before the next `for` step in cli.py, and the
  # websocket loop in server.py drains its queue to the sentinel before it
  # reads the next message. Silencing it costs threading `loop=loop,
  # queue=queue, failure=failure` through closures that already read clearly,
  # to state an invariant the rule cannot see anyway.
  "B023",
]

# The families NOT selected, and why — so that turning one on later is a
# decision someone makes rather than one a release makes for them:
#
#   BLE001  Broad `except Exception`, 63 sites — and 26 of them are false
#           positives by ruff's own exemption. Ruff does not flag a blind
#           except whose body logs the exception; it flags one that calls a
#           helper which logs it. Verified with a two-function file under
#           `--isolated`: the inline `log.exception(...)` handler passes, the
#           identical handler that returns `_internal(err, where)` is flagged.
#           Every 500 arm in server.py is the second shape, because the
#           logging was deliberately factored into `_internal` (server.py:76)
#           after handlers were found returning torch's text — including an
#           absolute path — straight to the browser. Selecting the rule means
#           63 new directives, 26 of them suppressing a diagnostic that would
#           not exist had the log call been copy-pasted instead of shared.
#           It would also destroy the signal the 8 existing directives carried:
#           when every site is marked, the mark means nothing.
#   S       flake8-bandit as a family, 928 findings — S101 alone fires on
#           every `assert` in the test suite, which is what tests are made of.
#           S110 is selected individually above; it is the one member of this
#           family that makes a claim about the handler body rather than a
#           claim about tests being tests.
#   PL      pylint, 507 findings, mostly PLR limits on argument and branch
#           counts. Not a shape this codebase is written to.
#   ANN     1005 findings; ANN001 alone is 396. The codebase annotates its
#           public surface and not its torch hook callbacks, deliberately —
#           `def hook(module, args)` is torch's signature, not a choice.
#   D       pydocstyle, 626 findings. Docstrings here are prose where prose
#           helps, not one per symbol.
#   TRY/EM  159-160 findings each, both about moving exception message text
#           into intermediate variables. The messages here are written to be
#           read by a user at a terminal and are better at the raise site.
#   N (rest of)
#           N818 wants `Refusal`, `BadRequest`, `TooBig` and `LoadCancelled`
#           renamed to end in `Error`; those names are the vocabulary the API
#           and the UI use. N803 wants the SAE's `W_enc`/`W_dec` lowercased,
#           and they are named after the matrices in the paper. Hence N802
#           alone, which the codebase does hold to.
#   SIM, PERF, FURB, ISC, C4, PTH, ARG, PT, RUF (other than RUF100)
#           Style preferences with 1-15 findings apiece and no correctness
#           claim behind them. Left out because nothing here is written
#           against them, not because they are wrong.

[tool.hatch.build.targets.wheel]
packages = ["modelmri"]

# The built frontend is gitignored (produced by `npm run build` at release
# time). `artifacts` is hatchling's mechanism for including VCS-ignored build
# output: unlike force-include it tolerates the path being absent (fresh
# clone, CI) and never double-adds files already inside the package.
[tool.hatch.build]
artifacts = [
    "modelmri/static/app/index.html",
    "modelmri/static/app/assets/**",
    # The `.mri` viewer. Shipped so `modelmri open` can serve it from the
    # standard library alone -- reading a 54 KB recording should not import
    # torch, which costs 26 seconds and is needed for none of it.
    "modelmri/static/viewer/index.html",
    "modelmri/static/viewer/assets/**",
]
exclude = ["modelmri/static/app/.gitkeep"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "modelmri/__init__.py"

# ---------------------------------------------------------------- GPU on dev
# PyPI's torch wheels for Windows are CPU-only. The owner of this repo sat on
# an RTX 4060 running everything on the CPU because `uv sync` had quietly
# installed `torch+cpu` and the accelerator badge only said "reinstall with
# GPU support (see the README)".
#
# This affects THIS repository's development environment only — it is not
# inherited by anyone who `pip install modelmri`. The Linux marker keeps CI on
# PyPI, where the default wheels already carry CUDA.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]
# Develop against the copy in this repo, not the published one, so a recorder
# change is testable here before it is released.
#
# PATH sources, deliberately NOT `[tool.uv.workspace]` members. Making them
# members was tried and measured, and it broke the one thing this whole
# feature exists to protect: uv resolves a workspace universally, across every
# member's extras, so lerobot's constraints reached ModelMRI's own tree and
# DOWNGRADED transformers 5.13.0 -> 5.5.4 in this environment. The process
# boundary keeps lerobot out of ModelMRI's runtime; a shared lockfile put it
# back in through the front door. The security job drops these two by name
# instead — see `--no-emit-package` in security.yml.
modelmri-record = { path = "packages/modelmri-record", editable = true }
# Same reason, and it is not published yet either. Dev-only: nothing in
# `[project.dependencies]` names it, so `pip install modelmri` does not pull
# it and the two environments stay separate for users.
modelmri-policy = { path = "packages/modelmri-policy", editable = true }
