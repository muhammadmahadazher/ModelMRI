[project]
name = "modelmri-record"
# Read from `modelmri_record/__init__.py` (see [tool.hatch.version] below)
# rather than written here. Two literals is two chances to ship a wrong one,
# and this package's copy is not inert: `__version__` is stamped into every
# recorded document as `meta.recorder`. `modelmri` has been single-sourced this
# way for as long as there has been a test holding it there; this package was
# the one that had drifted out of that rule.
dynamic = ["version"]
description = "Record agent runs — LLM calls, tool calls, subagents — and view them on a ModelMRI timeline. Stdlib only."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Muhammad Mahad Azher" }]
keywords = ["agents", "tracing", "observability", "llm", "debugging"]
# No `License ::` classifier: `license` above is an SPDX expression (PEP 639),
# and PyPI rejects an upload that carries a license classifier beside one.
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Debuggers",
]

# Deliberately empty. The whole point of splitting this out of `modelmri` is
# that instrumenting an agent should not pull a deep-learning stack.
dependencies = []

# The `mri_trace` fixture, available to any pytest run once this package is
# installed. Registering it here rather than asking for a conftest import
# means a CI step gets it from `pip install modelmri-record` alone.
#
# The plugin imports nothing at module scope beyond pytest and this package,
# so a test suite that never touches ModelMRI pays nothing for its presence.
[project.entry-points.pytest11]
modelmri_record = "modelmri_record.pytest_plugin"

[project.urls]
Homepage = "https://github.com/muhammadmahadazher/ModelMRI"
Source = "https://github.com/muhammadmahadazher/ModelMRI"
Issues = "https://github.com/muhammadmahadazher/ModelMRI/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "modelmri_record/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["modelmri_record"]
